name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      platform-images: ${{ steps.platform_images.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: wrensecurity/wrenidm

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            MAVEN_BUILD_ARGS=-DskipTests
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve platform-specific images
        id: platform_images
        env:
          IMAGE: wrensecurity/wrenidm@${{ steps.build.outputs.digest }}
        run: |
          images=$(docker buildx imagetools inspect "${IMAGE}" --raw | jq -ec '[
            .manifests[] | select(.platform.os == "linux") | {
              platform: (.platform.architecture + (if .platform.variant then "-" + .platform.variant else "" end)),
              digest
            }
          ]')
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  sbom_image:
    name: Generate and attest SBOM for Docker image (${{ matrix.platform }})
    needs: push_to_registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.push_to_registry.outputs.platform-images) }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: wrensecurity/wrenidm@${{ matrix.digest }}
          syft-version: v1.52.0
          format: cyclonedx-json
          output-file: sbom-docker-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/wrensecurity/wrenidm
          subject-digest: ${{ matrix.digest }}
          sbom-path: sbom-docker-image.cdx.json
          push-to-registry: true

  sbom_source:
    name: Generate and attest SBOM for Maven dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build project
        run: mvn -B clean install -DskipTests

      - name: Generate SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputName=sbom-source-deps.cdx -DoutputFormat=json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/sbom-source-deps.cdx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" --clobber target/sbom-source-deps.cdx.json
